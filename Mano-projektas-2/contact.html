<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ilze Baltic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="Main navigation">
            <div class="container">
                <a class="site-logo" href="main.html" aria-label="F1 home"><img src="image/f1.png" alt="F1"><span class="site-title">Ilze Baltic</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto gap-4">
                        <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div id="main">
        <main class="content">
            <h1>Contact us</h1>
            <p>Want to ask about an item or resell something? Send us a message and include the item name or a short description.</p>
           
            <form class="contact-form">
                <div class="mb-4">
                    <label class="form-label" for="contact-name">Your name</label>
                    <input id="contact-name" name="name" type="text" class="form-control"
                           autocomplete="name" placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="contact-email">Email</label>
                    <input id="contact-email" name="email" type="email" class="form-control"
                           autocomplete="email" placeholder="Enter your email">
                </div>

                <fieldset class="mb-3 border rounded p-2">
                    <legend class="form-label">Gender</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" id="gender-female" type="radio" name="gender" value="female">
                        <label class="form-check-label" for="gender-female">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" id="gender-male" type="radio" name="gender" value="male">
                        <label class="form-check-label" for="gender-male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" id="gender-prefer-not-to-say" type="radio" name="gender" value="prefer-not-to-say">
                        <label class="form-check-label" for="gender-prefer-not-to-say">Prefer not to say</label>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label class="form-label" for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" class="form-control" rows="4"
                              placeholder="What would you like to ask?"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
                <div id="contact-success-alert" class="alert alert-success mt-3 d-none" role="status">
                    Message sent successfully!
                </div>
            </form>
        </main>
        <aside class="asidebar" aria-label="Featured items">
            <img src="image/reklama-1.jpeg" alt="Featured item from Ilze Baltic">
        </aside>
    </div>
    <footer class="footer">
        <p>&copy; 2026 Ilze Baltic. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
