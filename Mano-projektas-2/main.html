   <nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="Main navigation">
            <div class="container">

    <div id="main">
        <div class="content">


            <form class="listing-search" role="search">
                <label class="visually-hidden" for="listing-search-input">Search listings</label>
                <input id="listing-search-input" type="search" placeholder="Search homes...">
                <button type="button" aria-label="Search">
                    🔎
                </button>
            </form>
            <div class="listing-toolbar" aria-label="Listing sorting and filters">
                <fieldset class="listing-filters">
                    <legend>Property type</legend>
                 <button class="btn btn-primary">ALL</button>
                 <button class="btn btn-primary">Main</button>
                <button class="btn btn-primary">Apply Filters</button>
                </fieldset>
                <label class="listing-sort">
                    <span>Sort by</span>
                    <select aria-label="Sort listings">
                        <option>Recommended</option>
                        <option>Newest</option>
                        <option>Price: low to high</option>
                        <option>Price: high to low</option>
                    </select>
                </label>
            </div>








            
            <div class="container-fluid">
                <div class="row g-4 property-gallery">
                    <div class="col-12 col-md-6 col-lg-4">
                        <figure class="card h-100 shadow-sm">
                            <div class="property-image position-relative">
                                <a class="listing-eye" href="modern-house.html" aria-label="View Modern House">👁️</a>
                                <span class="new-listing">New listing</span>
                                <img src="image/home1.jpg" alt="Modern two-story house with panoramic windows" class="card-img-top">
                                <input class="listing-favorite-toggle" type="checkbox" id="favorite-home1">
                                <label class="listing-favorite" for="favorite-home1" aria-label="Add Modern House to favorites">❤</label>
                            </div>
                            <figcaption class="card-body d-flex flex-column">
                                <h5 class="card-title">Modern House</h5>
                                <p class="card-text property-details">A modern two-story house with panoramic windows, a spacious living room, and a cozy terrace.</p>
                                <p class="property-meta">Area: 180 m² · Rooms: 4</p>
                                <p class="property-price">Price: €285 000</p>
                                <a class="btn btn-primary property-details-link" href="modern-house.html">View details</a>
                            </figcaption>
                        </figure>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <figure class="card h-100 shadow-sm">
                            <div class="property-image position-relative">

                            <figcaption class="card-body d-flex flex-column">

                                <p class="property-price">Price: €159 000</p>
                                <a class="btn btn-primary property-details-link" href="cozy-home.html">View details</a>
                            </figcaption>
                        </figure>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">

                            </figcaption>

                    </div>
